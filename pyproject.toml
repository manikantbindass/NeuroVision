[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "neurovision-2028"
version = "0.1.0"
description = "Research architecture for brain MRI segmentation and mapping"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = ["mypy==1.19.1", "pre-commit==4.5.1", "ruff==0.17.3"]
imaging = ["nibabel>=5.4,<6", "numpy>=2.2.6,<2.5", "pydicom>=3.0.2,<4"]
preprocessing = ["scipy>=1.15,<2"]
bias = ["SimpleITK>=2.5.3,<3"]

[project.scripts]
neurovision = "neurovision.__main__:main"

[tool.setuptools.packages.find]
include = ["neurovision", "neurovision.*"]
namespaces = false

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["neurovision", "tests"]
strict = true
untyped_calls_exclude = ["nibabel", "SimpleITK"]

[[tool.mypy.overrides]]
module = ["nibabel", "nibabel.*", "scipy", "scipy.*", "SimpleITK", "SimpleITK.*"]
ignore_missing_imports = true
