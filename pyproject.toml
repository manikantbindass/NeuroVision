[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "neurovision-2028"
version = "0.1.0"
description = "Research architecture for brain MRI segmentation and mapping"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = ["ruff==0.17.3"]

[tool.setuptools.packages.find]
include = ["neurovision", "neurovision.*"]
namespaces = false

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
