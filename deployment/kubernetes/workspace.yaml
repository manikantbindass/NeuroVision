---
# Source: neurovision/templates/network-policy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: neurovision-runtime
spec:
  podSelector:
    matchLabels: {app: neurovision}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: neurovision, component: web}}
      ports: [{port: 8000, protocol: TCP}]
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
      ports: [{port: 9000, protocol: TCP}]
    - ports: [{port: 8080, protocol: TCP}]
  egress:
    - to:
        - podSelector: {matchLabels: {app: neurovision, component: api}}
      ports: [{port: 8000, protocol: TCP}]
    - ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - ports: [{port: 5432, protocol: TCP}, {port: 6379, protocol: TCP}]
---
# Source: neurovision/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: neurovision-config
data:
  NEUROVISION_WORKER_DEVICE: "cpu"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
---
# Source: neurovision/templates/services.yaml
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: {app: neurovision, component: api}
  ports: [{name: http, port: 8000, targetPort: http}]
---
# Source: neurovision/templates/services.yaml
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector: {app: neurovision, component: web}
  ports: [{name: http, port: 8080, targetPort: http}]
---
# Source: neurovision/templates/workloads.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neurovision-api
  labels:
    app.kubernetes.io/name: neurovision
    app.kubernetes.io/component: api
spec:
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: neurovision, component: api}
  template:
    metadata:
      labels: {app: neurovision, component: api}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: "neurovision-api:local"
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: neurovision-config}
          env:
            - name: NEUROVISION_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: neurovision-runtime, key: database-url}
            - name: NEUROVISION_REDIS_URL
              valueFrom:
                secretKeyRef: {name: neurovision-runtime, key: redis-url}
            - name: NEUROVISION_API_TOKEN
              valueFrom:
                secretKeyRef: {name: neurovision-runtime, key: api-token}
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 4
          resources:
            limits:
              cpu: "1"
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: temporary, mountPath: /tmp}
      volumes:
        - name: temporary
          emptyDir: {sizeLimit: 256Mi}
---
