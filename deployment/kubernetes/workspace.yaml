apiVersion: apps/v1
kind: Deployment
metadata:
  name: neurovision-worker
  labels:
    app.kubernetes.io/name: neurovision
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: neurovision, component: worker}
  template:
    metadata:
      labels: {app: neurovision, component: worker}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9000"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: "neurovision-api:local"
          imagePullPolicy: IfNotPresent
          command: [python, -m, apps.api.worker]
          envFrom:
            - configMapRef: {name: neurovision-config}
          env:
            - name: NEUROVISION_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: neurovision-runtime, key: database-url}
          ports:
            - name: http
              containerPort: 9000
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 4
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
            requests:
              cpu: 500m
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: temporary, mountPath: /tmp}
      volumes:
        - name: temporary
          emptyDir: {sizeLimit: 256Mi}
