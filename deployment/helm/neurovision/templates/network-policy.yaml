apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: neurovision-runtime
spec:
  podSelector:
    matchLabels: {app: neurovision}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: neurovision, component: web}}
      ports: [{port: 8000, protocol: TCP}]
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
      ports: [{port: 9000, protocol: TCP}, {port: 8000, protocol: TCP}]
    - ports: [{port: 8080, protocol: TCP}]
  egress:
    - to:
        - podSelector: {matchLabels: {app: neurovision, component: api}}
      ports: [{port: 8000, protocol: TCP}]
    - ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - ports: [{port: 5432, protocol: TCP}, {port: 6379, protocol: TCP}]
