apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: {app: neurovision, component: api}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector: {app: neurovision, component: web}
  ports: [{name: http, port: 8080, targetPort: http}]
