{{- range $role := list "api" "worker" "web" }}
{{- $component := index $.Values $role }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neurovision-{{ $role }}
  labels:
    app.kubernetes.io/name: neurovision
    app.kubernetes.io/component: {{ $role }}
spec:
  {{- if not (and (eq $role "api") $.Values.autoscaling.enabled) }}
  replicas: {{ $component.replicas }}
  {{- end }}
  revisionHistoryLimit: 3
  strategy:
    {{- if eq $role "worker" }}
    type: Recreate
    {{- else }}
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
    {{- end }}
  selector:
    matchLabels: {app: neurovision, component: {{ $role }}}
  template:
    metadata:
      labels: {app: neurovision, component: {{ $role }}}
      {{- if eq $role "worker" }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9000"
      {{- end }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ ternary 101 10001 (eq $role "web") }}
        runAsGroup: {{ ternary 101 10001 (eq $role "web") }}
        seccompProfile: {type: RuntimeDefault}
      {{- with $component.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and (eq $role "worker") $.Values.worker.gpu }}
      tolerations:
        - {key: "nvidia.com/gpu", operator: Exists, effect: NoSchedule}
      {{- end }}
      containers:
        - name: {{ $role }}
          image: {{ $component.image | quote }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          {{- if eq $role "worker" }}
          command: [python, -m, apps.api.worker]
          {{- end }}
          {{- if ne $role "web" }}
          envFrom:
            - configMapRef: {name: neurovision-config}
          env:
            - name: NEUROVISION_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: {{ $.Values.existingSecret }}, key: database-url}
            {{- if eq $role "api" }}
            - name: NEUROVISION_REDIS_URL
              valueFrom:
                secretKeyRef: {name: {{ $.Values.existingSecret }}, key: redis-url}
            - name: NEUROVISION_API_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ $.Values.existingSecret }}, key: api-token}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ ternary 8080 (ternary 9000 8000 (eq $role "worker")) (eq $role "web") }}
          startupProbe:
            httpGet:
              path: {{ ternary "/healthz" (ternary "/health" "/api/v1/health" (eq $role "worker")) (eq $role "web") }}
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: {{ ternary "/healthz" (ternary "/health" "/api/v1/health" (eq $role "worker")) (eq $role "web") }}
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: {{ ternary "/healthz" (ternary "/ready" "/api/v1/ready" (eq $role "worker")) (eq $role "web") }}
              port: http
            periodSeconds: 10
            timeoutSeconds: 4
          resources:
            {{- if and (eq $role "worker") $.Values.worker.gpu }}
            requests:
              {{- toYaml $component.resources.requests | nindent 14 }}
              nvidia.com/gpu: 1
            limits:
              {{- toYaml $component.resources.limits | nindent 14 }}
              nvidia.com/gpu: 1
            {{- else }}
            {{- toYaml $component.resources | nindent 12 }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: temporary, mountPath: /tmp}
      volumes:
        - name: temporary
          emptyDir: {sizeLimit: 256Mi}
{{- end }}
