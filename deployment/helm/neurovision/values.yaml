# One release per namespace. Secret contents are supplied independently.
existingSecret: neurovision-runtime
api:
  image: neurovision-api:local
  replicas: 2
  nodeSelector: {}
  resources:
    requests: {cpu: 250m, memory: 1Gi}
    limits: {cpu: "1", memory: 2Gi}
worker:
  image: neurovision-api:local
  replicas: 1
  nodeSelector: {}
  gpu: false
  resources:
    requests: {cpu: 500m, memory: 2Gi}
    limits: {cpu: "2", memory: 4Gi}
web:
  image: neurovision-web:local
  replicas: 2
  resources:
    requests: {cpu: 50m, memory: 32Mi}
    limits: {cpu: 250m, memory: 128Mi}
imagePullPolicy: IfNotPresent
imagePullSecrets: []
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  cpuUtilization: 70
ingress:
  enabled: false
  className: nginx
  host: neurovision.example.org
  tlsSecret: neurovision-tls
  annotations: {}
