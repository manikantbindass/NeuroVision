    <ellipse cx="118" cy="101" rx="75" ry="72"/>
    <ellipse cx="118" cy="101" rx="57" ry="54" opacity=".65"/>
    <ellipse cx="118" cy="101" rx="34" ry="33" opacity=".4"/>
    <path d="M118 29v144M43 101h150" opacity=".28"/>
    <g clip-path="url(#scan)">
      <path d="M43 101h150" stroke-width="3">
