name: Security and privacy

on:
  push:
  pull_request:
  schedule:
    - cron: "22 4 * * 1"

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/check_research_data.py
      - run: python -m pip install "ruff==0.17.3"
      - run: python -m ruff check --select S neurovision apps/api
      - run: |
          docker run --rm --network none -v "$PWD:/repo:ro" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 git --redact=100 --no-banner --log-opts="--all HEAD" /repo

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: python -m pip install --no-deps "torch>=2.8,<3" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install ".[imaging,preprocessing,bias,training,zoo,api,pdf,mlops,distributed]"
      - run: |
          python -m pip list --format=freeze --exclude neurovision-2028 |
            sed -E 's/^(torch==[^+]+)\+.*$/\1/' > "$RUNNER_TEMP/python-audit.txt"
          pipx run --spec 'pip-audit>=2.9,<3' pip-audit --strict --no-deps --disable-pip \
            -r "$RUNNER_TEMP/python-audit.txt"
      - run: npm audit --audit-level=high
        working-directory: apps/web
