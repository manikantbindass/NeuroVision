name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --no-deps "torch>=2.8,<3" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install ".[dev,imaging,preprocessing,bias,training,zoo]"
      - run: python -m ruff check neurovision tests
      - run: python -m ruff format --check neurovision tests
      - run: python -m mypy
      - run: python -m pre_commit validate-config
      - run: python -m unittest discover -s tests -v
      - run: python -m neurovision.uncertainty.example --output artifacts/neuroconfidence-synthetic
      - run: node tests/check_neuroconfidence.cjs artifacts/neuroconfidence-synthetic/neuroconfidence.html
      - run: python -m neurovision.mapping.example --output artifacts/neuromap-synthetic/comparison.html
      - run: python -m neurovision.longitudinal.example --output artifacts/neurotimeline-synthetic/timeline.html
      - run: node tests/check_neurotimeline.cjs artifacts/neurotimeline-synthetic/timeline.html
      - run: python -m pip check
      - run: python -I -m neurovision
        working-directory: ${{ runner.temp }}

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: docker compose config --quiet
      - run: docker compose run --build --rm pipeline
