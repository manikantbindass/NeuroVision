<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 90" role="img" aria-labelledby="title">
  <title id="title">MRI to structured research report</title>
  <rect width="960" height="90" rx="16" fill="#0a1527"/>
  <path d="M110 54h740" fill="none" stroke="#427287" stroke-width="2"/>
  <g fill="#a5e7ef" font-family="system-ui, sans-serif" font-size="17" text-anchor="middle">
    <text x="110" y="35">MRI</text>
    <text x="345" y="35">Segmentation</text>
    <text x="600" y="35">Quantification</text>
    <text x="850" y="35">Research report</text>
    <circle cx="110" cy="54" r="4"/>
    <circle cx="345" cy="54" r="4"/>
    <circle cx="600" cy="54" r="4"/>
    <circle cx="850" cy="54" r="4"/>
  </g>
  <circle cx="110" cy="54" r="6" fill="#58dce6">
    <animate attributeName="cx" values="110;850" dur="8s" repeatCount="indefinite"/>
  </circle>
</svg>
